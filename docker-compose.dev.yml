# DevForge — overrides développement local
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  # En local, l’API sert encore la SPA via /devforge (overlay) + Livewire.
  # Le service web image n’est pas nécessaire : on désactive le proxy séparé.
  proxy:
    profiles: ["standalone-web"]

  web:
    profiles: ["standalone-web"]

  api:
    image: devforge-api:dev
    pull_policy: never
    build:
      context: .
      dockerfile: ./docker/development/Dockerfile
      args:
        - USER_ID=${USERID:-1000}
        - GROUP_ID=${GROUPID:-1000}
    ports:
      - "${APP_PORT:-8000}:8080"
    environment:
      AUTORUN_ENABLED: false
      APP_NAME: ${APP_NAME:-DevForge}
      DEVFORGE_ENABLED: "true"
      AGENT_URL: http://agent:8090
      PUSHER_HOST: "${PUSHER_HOST}"
      PUSHER_PORT: "${PUSHER_PORT}"
      PUSHER_SCHEME: "${PUSHER_SCHEME:-http}"
      PUSHER_APP_ID: "${PUSHER_APP_ID:-devforge}"
      PUSHER_APP_KEY: "${PUSHER_APP_KEY:-devforge}"
      PUSHER_APP_SECRET: "${PUSHER_APP_SECRET:-devforge}"
    healthcheck:
      test: curl -sf http://127.0.0.1:8080/api/health || exit 1
      interval: 5s
      retries: 10
      timeout: 2s
    volumes:
      - ./backend:/var/www/html/:cached
      - dev_backups_data:/var/www/html/storage/app/backups
    networks:
      - devforge

  postgres:
    pull_policy: always
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: "${DB_USERNAME:-devforge}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
      POSTGRES_DB: "${DB_DATABASE:-devforge}"
      POSTGRES_HOST_AUTH_METHOD: "trust"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
      timeout: 2s
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data

  redis:
    pull_policy: always
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    env_file:
      - ./backend/.env
    healthcheck:
      test: redis-cli ping
      interval: 5s
      retries: 10
      timeout: 2s
    volumes:
      - dev_redis_data:/data

  realtime:
    image: devforge-realtime:dev
    pull_policy: never
    build:
      context: .
      dockerfile: ./docker/devforge-realtime/Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "${FORWARD_SOKETI_PORT:-6001}:6001"
      - "6002:6002"
    volumes:
      - ./backend/storage:/var/www/html/storage
      - ./docker/devforge-realtime/terminal-server.js:/terminal/terminal-server.js
      - ./docker/devforge-realtime/terminal-utils.js:/terminal/terminal-utils.js
    environment:
      SOKETI_DEBUG: "false"
      SOKETI_DEFAULT_APP_ID: "${PUSHER_APP_ID:-devforge}"
      SOKETI_DEFAULT_APP_KEY: "${PUSHER_APP_KEY:-devforge}"
      SOKETI_DEFAULT_APP_SECRET: "${PUSHER_APP_SECRET:-devforge}"
      SOKETI_HOST: "${SOKETI_HOST:-0.0.0.0}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6001/ready && curl -fsS http://127.0.0.1:6002/ready || exit 1"]
      interval: 5s
      retries: 10
      timeout: 2s
    entrypoint: ["/bin/sh", "/soketi-entrypoint.sh"]

  agent:
    image: devforge-agent:dev
    pull_policy: never
    build:
      context: .
      dockerfile: docker/devforge-agent/Dockerfile
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      AGENT_LISTEN: 0.0.0.0:8090
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/health || exit 1"]
      interval: 5s
      retries: 10
      timeout: 2s

  vite:
    image: node:24-alpine
    pull_policy: always
    container_name: devforge-vite
    working_dir: /repo
    environment:
      VITE_HOST: "${VITE_HOST:-localhost}"
      VITE_PORT: "${VITE_PORT:-5173}"
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - .:/repo/:cached
    command: sh -c "npm install && npm run dev"
    networks:
      - devforge

  frontend:
    image: node:24-alpine
    pull_policy: always
    container_name: devforge-frontend
    working_dir: /repo
    ports:
      - "${DEVFORGE_PORT:-4321}:4321"
    volumes:
      - .:/repo/:cached
    command: sh -c "npm install && npm run dev:frontend"
    networks:
      - devforge

  testing-host:
    image: devforge-testing-host:dev
    pull_policy: never
    build:
      context: .
      dockerfile: ./docker/testing-host/Dockerfile
    init: true
    container_name: devforge-testing-host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dev_platform_data:/data/devforge
      - dev_backups_data:/data/devforge/backups
      - dev_postgres_data:/data/devforge/_volumes/database
      - dev_redis_data:/data/devforge/_volumes/redis
      - dev_minio_data:/data/devforge/_volumes/minio
    networks:
      - devforge

  mailpit:
    image: axllent/mailpit:latest
    pull_policy: always
    container_name: devforge-mail
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - devforge

  minio:
    image: coollabsio/maxio:latest
    pull_policy: always
    container_name: devforge-minio
    ports:
      - "${FORWARD_MINIO_PORT:-9000}:9000"
      - "${FORWARD_MINIO_PORT_CONSOLE:-9001}:9001"
    environment:
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - dev_minio_data:/data
    networks:
      - devforge

  minio-init:
    image: minio/mc:latest
    pull_policy: always
    container_name: devforge-minio-init
    restart: "no"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      until mc alias set local http://devforge-minio:9000 minioadmin minioadmin 2>/dev/null; do
        echo 'MinIO not ready yet, waiting...';
        sleep 2;
      done;
      echo 'MinIO is ready, creating bucket if needed...';
      mc mb local/local --ignore-existing;
      echo 'MinIO initialization complete - bucket local is ready';
      "
    networks:
      - devforge

volumes:
  dev_backups_data:
  dev_postgres_data:
  dev_redis_data:
  dev_platform_data:
  dev_minio_data:
