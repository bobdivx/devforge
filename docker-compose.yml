# DevForge — définitions de base
# Prod : docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d
# Dev  : docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: devforge-proxy
    restart: unless-stopped
    networks:
      - devforge
    logging: *default-logging

  api:
    container_name: devforge-api
    restart: unless-stopped
    working_dir: /var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - devforge
    depends_on:
      - postgres
      - redis
      - realtime
      - agent
    logging: *default-logging

  web:
    container_name: devforge-web
    restart: unless-stopped
    networks:
      - devforge
    logging: *default-logging

  postgres:
    image: postgres:15-alpine
    container_name: devforge-db
    restart: unless-stopped
    networks:
      - devforge
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: devforge-redis
    restart: unless-stopped
    networks:
      - devforge
    logging: *default-logging

  realtime:
    container_name: devforge-realtime
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - devforge
    logging: *default-logging

  agent:
    container_name: devforge-agent
    restart: unless-stopped
    networks:
      - devforge
    logging: *default-logging

networks:
  devforge:
    name: devforge
    driver: bridge
    external: false
