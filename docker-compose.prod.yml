# DevForge — overrides production / NAS
# Usage:
#   cp .env.devforge.example .env
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d --build

services:
  proxy:
    ports:
      - "${DEVFORGE_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/devforge-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
      - realtime
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: ${DEVFORGE_API_IMAGE:-bobdivx/devforge:latest}
    build:
      context: .
      dockerfile: docker/devforge-api/Dockerfile
    volumes:
      - type: bind
        source: ${DEVFORGE_ENV_FILE:-./.env}
        target: /var/www/html/.env
        read_only: true
      - ${DEVFORGE_DATA_ROOT:-/media/Docker/AppData/devforge}/ssh:/var/www/html/storage/app/ssh
      - ${DEVFORGE_DATA_ROOT:-/media/Docker/AppData/devforge}/applications:/var/www/html/storage/app/applications
      - ${DEVFORGE_DATA_ROOT:-/media/Docker/AppData/devforge}/databases:/var/www/html/storage/app/databases
      - ${DEVFORGE_DATA_ROOT:-/media/Docker/AppData/devforge}/services:/var/www/html/storage/app/services
      - ${DEVFORGE_DATA_ROOT:-/media/Docker/AppData/devforge}/backups:/var/www/html/storage/app/backups
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DEVFORGE_PLATFORM_DATA:-/media/Docker/AppData/devforge/data}:/data
    environment:
      APP_NAME: ${APP_NAME:-DevForge}
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-devforge}
      DB_USERNAME: ${DB_USERNAME:-devforge}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DEVFORGE_ENABLED: "true"
      DEVFORGE_AGENTS_ENABLED: ${DEVFORGE_AGENTS_ENABLED:-true}
      DEVFORGE_DATA_DIR: ${DEVFORGE_PLATFORM_DATA:-/data/devforge}
      HELPER_IMAGE: ${HELPER_IMAGE:-bobdivx/devforge}
      AGENT_URL: ${AGENT_URL:-http://agent:8090}
    env_file:
      - ${DEVFORGE_ENV_FILE:-./.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: ${DEVFORGE_WEB_IMAGE:-bobdivx/devforge:web}
    build:
      context: .
      dockerfile: docker/devforge-web/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    environment:
      POSTGRES_USER: ${DB_USERNAME:-devforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_DATABASE:-devforge}
    volumes:
      - ${DEVFORGE_POSTGRES_DATA:-/media/Docker/AppData/devforge/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-devforge} -d ${DB_DATABASE:-devforge}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    command: ["redis-server", "--save", "20", "1", "--loglevel", "warning"]
    volumes:
      - ${DEVFORGE_REDIS_DATA:-/media/Docker/AppData/devforge/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  realtime:
    image: ${DEVFORGE_REALTIME_IMAGE:-bobdivx/devforge:realtime}
    build:
      context: .
      dockerfile: docker/devforge-realtime/Dockerfile
    volumes:
      - ${DEVFORGE_DATA_ROOT:-/media/Docker/AppData/devforge}/ssh:/var/www/html/storage/app/ssh
    environment:
      APP_NAME: ${APP_NAME:-DevForge}
      SOKETI_DEBUG: ${SOKETI_DEBUG:-false}
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-app-id}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-app-key}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-app-secret}
      SOKETI_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6001/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  agent:
    image: ${DEVFORGE_AGENT_IMAGE:-bobdivx/devforge:agent}
    build:
      context: .
      dockerfile: docker/devforge-agent/Dockerfile
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      AGENT_LISTEN: 0.0.0.0:8090
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
