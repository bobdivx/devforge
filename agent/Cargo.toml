[package]
name = "devforge-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rig = { version = "0.42", features = ["rmcp"] }
rmcp = { version = "2", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
