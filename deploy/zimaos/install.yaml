# ZimaOS / CasaOS — install Custom App (minimal).
# Config métier → UI DevForge, pas ce fichier.

name: devforge

services:
  devforge:
    image: bobdivx/devforge:2.0.2
    container_name: devforge
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8000:8000"
    volumes:
      - /DATA/AppData/devforge:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    labels:
      icon: https://raw.githubusercontent.com/bobdivx/devforge/main/deploy/zimaos/icon.svg
      description: DevForge v2 — config dans l’UI, pas dans Variables
      webui: http://{{inthost}}:8000
      port.8000: Web UI + API
