# DevForge v2 — ZimaOS / CasaOS Custom App
# Import : App Store → Installer une app personnalisée → coller ce fichier
#
# Tout le runtime (DB, static UI, executor local) vient de l’image.
# Config métier (GitHub, domaine, SSH distant) → UI DevForge (wizard / Settings).
# Ne remplis PAS le panneau Variables ZimaOS avec des secrets app.

name: devforge

services:
  devforge:
    image: bobdivx/devforge:2.0.7
    container_name: devforge
    restart: unless-stopped
    ports:
      - target: 8000
        published: "8000"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/devforge
        target: /data
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    x-casaos:
      volumes:
        - container: /data
          description:
            en_US: App data (SQLite, SSH keys, deploys)
            fr_FR: Données app (SQLite, clés SSH, déploiements)
        - container: /var/run/docker.sock
          description:
            en_US: Docker socket (local deploys — no SSH needed)
            fr_FR: Socket Docker (déploiements locaux — pas de SSH)
      ports:
        - container: "8000"
          description:
            en_US: Web UI + API
            fr_FR: Interface web + API

x-casaos:
  id: com.bobdivx.devforge
  main: devforge
  index: /
  port_map: "8000"
  scheme: http
  icon: https://raw.githubusercontent.com/bobdivx/devforge/main/deploy/zimaos/icon.svg
  title:
    en_US: DevForge
    fr_FR: DevForge
  tagline:
    en_US: Deploy apps with AI agents
    fr_FR: Déploie des apps avec des agents IA
  description:
    en_US: |
      Self-hosted PaaS. Open http://NAS:8000, create admin, finish onboarding in the UI.
      Docker socket = local deploys. Remote SSH is optional (Settings).
    fr_FR: |
      PaaS self-host. Ouvre http://NAS:8000, crée l’admin, termine le wizard dans l’UI.
      Socket Docker = déploiements locaux. SSH distant optionnel (Settings).
  author: bobdivx
  developer: DevForge
  category: Developer
  architectures:
    - amd64
    - arm64
  version: "2.0.7"
  update_at: "2026-09-11"
  website: https://github.com/bobdivx/devforge
  repo: https://github.com/bobdivx/devforge
  tips:
    before_install:
      en_US: Leave Variables empty — configure GitHub/domain/SSH in the DevForge UI after install.
      fr_FR: Laisse Variables vide — configure GitHub/domaine/SSH dans l’UI DevForge après install.
