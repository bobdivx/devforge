# DevForge v2 — déploiement self-host (Docker Compose)
#
# Usage :
#   cp .env.example .env   # optionnel
#   export DEVFORGE_VERSION=2.0.0
#   docker compose -f deploy/docker-compose.yml up -d
#
# Images :
#   bobdivx/devforge:2.0.0  (Docker Hub)
#   ghcr.io/bobdivx/devforge:2.0.0

name: devforge

services:
  devforge:
    image: ${DEVFORGE_IMAGE:-bobdivx/devforge}:${DEVFORGE_VERSION:-2.0.0}
    container_name: ${DEVFORGE_CONTAINER_NAME:-devforge}
    restart: unless-stopped
    ports:
      - "${DEVFORGE_HTTP_PORT:-8000}:8000"
    volumes:
      - ${DEVFORGE_DATA_DIR:-./data}:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/opt/devforge/docker-compose.yml:ro
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: sqlite:/data/devforge.db?mode=rwc
      DEVFORGE_DATA_DIR: /data
      DEVFORGE_STATIC_DIR: /app/web
      DEVFORGE_VERSION: ${DEVFORGE_VERSION:-2.0.0}
      DEVFORGE_UPDATE_MODE: compose
      DEVFORGE_UPDATE_COMPOSE_FILE: /opt/devforge/docker-compose.yml
      DEVFORGE_UPDATE_COMPOSE_SERVICE: devforge
      DEVFORGE_SELF_CONTAINER: ${DEVFORGE_CONTAINER_NAME:-devforge}
      DEVFORGE_UPDATE_IMAGE: ${DEVFORGE_IMAGE:-bobdivx/devforge}
      DEVFORGE_UPDATE_REPO: ${DEVFORGE_UPDATE_REPO:-bobdivx/devforge}
      DEVFORGE_EXECUTOR: ${DEVFORGE_EXECUTOR:-local}
      DEVFORGE_CORS_ORIGINS: ${DEVFORGE_CORS_ORIGINS:-}
      DEVFORGE_GITHUB_WEBHOOK_SECRET: ${DEVFORGE_GITHUB_WEBHOOK_SECRET:-}
      DEVFORGE_ALLOW_REGISTER: ${DEVFORGE_ALLOW_REGISTER:-0}
      DEVFORGE_ALLOW_INSECURE_WEBHOOK: ${DEVFORGE_ALLOW_INSECURE_WEBHOOK:-0}
      DEVFORGE_GITHUB_TOKEN: ${DEVFORGE_GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Décommenter pour limiter les ressources sur NAS
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 2G
