# Valeurs du chart DevForge. Tuto complet : wiki « Kubernetes ».

image:
  # Image publiée par le workflow « Docker images » du dépôt.
  repository: ghcr.io/bobdivx/devforge
  # Vide → appVersion du chart.
  tag: ""
  pullPolicy: IfNotPresent

# Secrets docker-registry pour tirer l'image DevForge elle-même (si registre privé).
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Toujours 1 : le control plane écrit dans /data (PVC ReadWriteOnce).
replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Contexte de sécurité compatible PodSecurity « restricted » (Talos l'applique par défaut
# en mode `baseline`/`restricted` selon la config). L'utilisateur 1000 (« node ») existe
# dans l'image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # L'atelier (npm) écrit hors de /data : racine en lecture-écriture.
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 80

ingress:
  # Désactivé par défaut : l'accès public passe par le tunnel Cloudflare (cloudflared →
  # Traefik). Activer pour exposer l'UI DevForge via Traefik (hôte ci-dessous).
  enabled: false
  # Traefik par défaut (voir deploy/kubernetes/traefik-values.yaml). Vide → classe par
  # défaut du cluster.
  className: traefik
  annotations: {}
  #  cert-manager.io/cluster-issuer: letsencrypt-prod
  host: devforge.example.com
  tls:
    enabled: false
    # Vide → <release>-tls
    secretName: ""

persistence:
  # /data : base SQLite historique, clés, sauvegardes locales, workspaces.
  enabled: true
  # Vide → StorageClass par défaut du cluster : local-path (k3s, Talos + local-path-provisioner)
  # en mono-nœud ; « longhorn » recommandé en multi-nœud (volumes répliqués).
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  # Réutiliser un PVC existant (désactive la création).
  existingClaim: ""

resources: {}
#  requests: { cpu: 250m, memory: 512Mi }
#  limits: { memory: 2Gi }

nodeSelector: {}
tolerations: []
affinity: {}

# Variables supplémentaires pour le serveur (non sensibles).
extraEnv: []
#  - name: DEVFORGE_ALLOW_REGISTER
#    value: "0"

# Secret existant injecté en entier (envFrom), ex. DEVFORGE_GITHUB_TOKEN, DEVFORGE_GITHUB_WEBHOOK_SECRET.
extraEnvFromSecret: ""

# Base du control plane. DevForge exige PostgreSQL ; en Docker il lance lui-même
# `devforge-pg`, impossible ici (pas de Docker) → Postgres intégré ou externe.
postgresql:
  # Postgres intégré (StatefulSet 1 réplica, non-root). Désactiver pour une base externe.
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
  user: devforge
  database: devforge
  # Vide → mot de passe aléatoire conservé entre les upgrades (lookup du Secret).
  password: ""
  storageClass: ""
  size: 5Gi
  resources: {}
  # Base externe : Secret existant contenant la clé `database-url` (postgres://…).
  # Utilisé uniquement si enabled=false.
  external:
    existingSecret: ""
    key: database-url

# Backend Kubernetes : où et comment DevForge déploie les apps des utilisateurs.
apps:
  # perProject (défaut) : un namespace par projet, `<namespacePrefix><projet>`, créé à la
  # demande avec les labels PodSecurity ci-dessous (RBAC : ClusterRole). Les apps sans
  # projet vont dans `namespace`.
  # single : tout dans `namespace` (RBAC : Role limité à ce namespace).
  namespaceMode: perProject
  namespacePrefix: devforge-
  # Namespace par défaut des apps (apps sans projet, mode single, secret de pull source).
  # Vide → même namespace que DevForge.
  namespace: devforge-apps
  # Créer ce namespace (avec labels PodSecurity). false si vous le gérez vous-même.
  createNamespace: true
  # Niveau PodSecurity des namespaces d'apps. « restricted » impose des images non-root ;
  # « baseline » si vos images tournent en root (nginx officiel…).
  podSecurity: restricted
  # IngressClass des apps. Traefik par défaut ; « none » → classe par défaut du cluster.
  ingressClass: traefik
  # ClusterIssuer cert-manager quand une app demande TLS. Vide par défaut : avec le tunnel
  # Cloudflare, le TLS public est terminé chez Cloudflare.
  clusterIssuer: ""
  # Secret dockerconfigjson pour tirer les images des apps (GHCR privé…), à créer dans
  # `apps.namespace` ; DevForge le recopie dans chaque namespace de projet.
  #   kubectl -n devforge-apps create secret docker-registry ghcr-pull \
  #     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT read:packages>
  imagePullSecret: ""

# Tunnel Cloudflare (exposition publique sans ouvrir de port) : un Deployment cloudflared.
# Dans le tableau de bord Cloudflare (Zero Trust → Tunnels), faire pointer chaque nom
# d'hôte public vers http://traefik.traefik.svc.cluster.local:80 (Traefik route ensuite
# selon l'en-tête Host des Ingress).
cloudflared:
  enabled: false
  image:
    repository: cloudflare/cloudflared
    tag: "2026.10.7"
  replicas: 1
  # Jeton du tunnel (« cloudflared tunnel run --token … »). Préférer existingSecret.
  token: ""
  # Secret existant contenant la clé `token`.
  existingSecret: ""
  resources: {}
