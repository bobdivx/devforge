# Valeurs du chart DevForge. Tuto complet : wiki « Kubernetes ».

image:
  # Image publiée par le workflow « Docker images » du dépôt.
  repository: ghcr.io/bobdivx/devforge
  # Vide → appVersion du chart.
  tag: ""
  pullPolicy: IfNotPresent

# Secrets docker-registry pour tirer l'image DevForge elle-même (si registre privé).
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Toujours 1 : le control plane écrit dans /data (PVC ReadWriteOnce).
replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Contexte de sécurité compatible PodSecurity « restricted » (Talos l'applique par défaut
# en mode `baseline`/`restricted` selon la config). L'utilisateur 1000 (« node ») existe
# dans l'image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # L'atelier (npm) écrit hors de /data : racine en lecture-écriture.
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  # Ex. traefik, nginx, cilium. Vide → IngressClass par défaut du cluster.
  className: ""
  annotations: {}
  #  cert-manager.io/cluster-issuer: letsencrypt-prod
  host: devforge.example.com
  tls:
    enabled: false
    # Vide → <release>-tls
    secretName: ""

persistence:
  # /data : base SQLite historique, clés, sauvegardes locales, workspaces.
  enabled: true
  # Vide → StorageClass par défaut du cluster (ex. local-path, longhorn, rook-ceph).
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  # Réutiliser un PVC existant (désactive la création).
  existingClaim: ""

resources: {}
#  requests: { cpu: 250m, memory: 512Mi }
#  limits: { memory: 2Gi }

nodeSelector: {}
tolerations: []
affinity: {}

# Variables supplémentaires pour le serveur (non sensibles).
extraEnv: []
#  - name: DEVFORGE_ALLOW_REGISTER
#    value: "0"

# Secret existant injecté en entier (envFrom), ex. DEVFORGE_GITHUB_TOKEN, DEVFORGE_GITHUB_WEBHOOK_SECRET.
extraEnvFromSecret: ""

# Base du control plane. DevForge exige PostgreSQL ; en Docker il lance lui-même
# `devforge-pg`, impossible ici (pas de Docker) → Postgres intégré ou externe.
postgresql:
  # Postgres intégré (StatefulSet 1 réplica, non-root). Désactiver pour une base externe.
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
  user: devforge
  database: devforge
  # Vide → mot de passe aléatoire conservé entre les upgrades (lookup du Secret).
  password: ""
  storageClass: ""
  size: 5Gi
  resources: {}
  # Base externe : Secret existant contenant la clé `database-url` (postgres://…).
  # Utilisé uniquement si enabled=false.
  external:
    existingSecret: ""
    key: database-url

# Backend Kubernetes : où et comment DevForge déploie les apps des utilisateurs.
apps:
  # Namespace des apps. Vide → même namespace que DevForge.
  namespace: devforge-apps
  # Créer le namespace (avec labels PodSecurity). false si vous le gérez vous-même.
  createNamespace: true
  # Niveau PodSecurity appliqué au namespace des apps. « restricted » impose des images
  # non-root ; « baseline » si vos images tournent en root (nginx officiel…).
  podSecurity: restricted
  # IngressClass par défaut des apps (vide → classe par défaut du cluster).
  ingressClass: ""
  # ClusterIssuer cert-manager par défaut quand une app demande TLS.
  clusterIssuer: ""
  # Secret dockerconfigjson par défaut (registre privé, ex. GHCR) dans le namespace des apps.
  imagePullSecret: ""
