{{- if .Values.cloudflared.enabled }}
{{- $c := .Values.cloudflared }}
{{- if not (or $c.token $c.existingSecret) }}
{{- fail "cloudflared.enabled=true : renseigner cloudflared.existingSecret (clé token) ou cloudflared.token" }}
{{- end }}
{{- $secret := default (printf "%s-cloudflared" (include "devforge.fullname" .)) $c.existingSecret }}
{{- if not $c.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "devforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $c.token | quote }}
---
{{- end }}
# Tunnel Cloudflare : les noms d'hôte publics se configurent côté Cloudflare et pointent
# vers le Service Traefik (ex. http://traefik.traefik.svc.cluster.local:80).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devforge.fullname" . }}-cloudflared
  labels:
    {{- include "devforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudflared
spec:
  replicas: {{ $c.replicas }}
  selector:
    # Pas de selectorLabels : le Service DevForge ne doit pas cibler ces pods.
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cloudflared
      annotations:
        checksum/token: {{ $c.token | sha256sum | trunc 16 | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: "{{ $c.image.repository }}:{{ $c.image.tag }}"
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
