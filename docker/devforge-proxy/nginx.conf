# Public entry: SPA + Laravel API on one origin (session cookies).
# Used with stock nginx:alpine — not a custom image build.

upstream devforge_api {
    server api:8080;
}

upstream devforge_web {
    server web:80;
}

upstream devforge_realtime {
    server realtime:6001;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Laravel / Fortify / Sanctum / API / Livewire (transition) / health
    location ~ ^/(api|login|logout|register|forgot-password|reset-password|two-factor-challenge|user|sanctum|livewire|telescope|horizon|up|mcp)(/|$) {
        proxy_pass http://devforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    # Realtime / terminal websocket
    location /app/ {
        proxy_pass http://devforge_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Legacy SPA URL → root
    location = /devforge {
        return 301 /;
    }
    location /devforge/ {
        rewrite ^/devforge/(.*)$ /$1 permanent;
    }

    # Static SPA
    location / {
        proxy_pass http://devforge_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
