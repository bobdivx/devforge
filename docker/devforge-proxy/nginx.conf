# Public entry: SPA + Laravel API on one origin (session cookies).
# Used with stock nginx:alpine — not a custom image build.

upstream devforge_api {
    server api:8080;
}

upstream devforge_web {
    server web:80;
}

upstream devforge_realtime {
    server realtime:6001;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Traefik / Caddy terminate TLS in front of this HTTP :8080 entry.
# Keep their X-Forwarded-Proto so Laravel does not emit http:// redirects
# (mixed content on https://web.briseteia.me and similar).
map $http_x_forwarded_proto $devforge_forwarded_proto {
    https   https;
    http    http;
    default $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Keep redirects on this origin (host:published-port), not the NAS :80 UI.
    absolute_redirect off;

    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Laravel / Fortify / Sanctum / API / Livewire (transition) / GitHub App
    # callbacks + event webhooks / health. $http_host keeps :8080 so generated
    # URLs stay on DevForge, not ZimaOS :80.
    location ~ ^/(api|login|logout|register|forgot-password|reset-password|two-factor-challenge|user|sanctum|livewire|telescope|horizon|up|mcp|webhooks)(/|$) {
        proxy_pass http://devforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $devforge_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
        proxy_read_timeout 300s;
    }

    # Browsers always request /favicon.ico at the origin root.
    location = /favicon.ico {
        proxy_pass http://devforge_web/brand/logo.png;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $devforge_forwarded_proto;
    }

    # Auth / Laravel public assets (not in the Astro SPA)
    location ~ ^/(css|fonts|brand|build)(/|$) {
        proxy_pass http://devforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $devforge_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Realtime / terminal websocket
    location /app/ {
        proxy_pass http://devforge_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Legacy SPA URL → root
    location = /devforge {
        return 301 /;
    }
    location /devforge/ {
        rewrite ^/devforge/(.*)$ /$1 permanent;
    }

    # Static SPA
    location / {
        proxy_pass http://devforge_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $devforge_forwarded_proto;
        # Rewrite upstream 301 Location (no port) back to a relative path.
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
    }
}
