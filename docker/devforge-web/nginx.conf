server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bounded access log (disk safety)
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Immutable hashed assets
    location ~* \.(?:js|css|woff2?|png|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Legacy path redirect (old overlay URL)
    location = /devforge {
        return 301 /;
    }
    location ~ ^/devforge/(.*)$ {
        return 301 /$1;
    }
}
