server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Published on a non-80 port (often :8080). Directory slash redirects
    # must stay relative or the browser drops the port and hits the host :80.
    absolute_redirect off;

    # Bounded access log (disk safety)
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Chrome requests /favicon.ico even when HTML uses a PNG icon.
    # Exact match beats the hashed-asset regex below (which would 404).
    location = /favicon.ico {
        try_files /favicon.ico /brand/logo.png =404;
        default_type image/png;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Immutable hashed assets
    location ~* \.(?:js|css|woff2?|png|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — serve index.html without a 301 that would drop :8080
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Legacy path redirect (old overlay URL)
    location = /devforge {
        return 301 /;
    }
    location ~ ^/devforge/(.*)$ {
        return 301 /$1;
    }
}
