name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Meta
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          HUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          TAGS="ghcr.io/${OWNER_LC}/devforge:${TAG},ghcr.io/${OWNER_LC}/devforge:latest"
          TAGS="${TAGS},${HUB_USER}/devforge:${TAG},${HUB_USER}/devforge:latest"
          # Alias mineur 2.0 si tag 2.0.x
          if [[ "$TAG" =~ ^([0-9]+\.[0-9]+)\. ]]; then
            MINOR="${BASH_REMATCH[1]}"
            TAGS="${TAGS},ghcr.io/${OWNER_LC}/devforge:${MINOR},${HUB_USER}/devforge:${MINOR}"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: devforge-server
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: devforge-server.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build -p devforge-server --release
      - name: Package
        shell: bash
        run: |
          STAGE="dist/${{ matrix.target }}"
          mkdir -p "$STAGE"
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            cp "target/release/${{ matrix.bin }}" "$STAGE/devforge-server.exe"
          else
            cp "target/release/${{ matrix.bin }}" "$STAGE/devforge-server"
            chmod +x "$STAGE/devforge-server"
          fi
          (
            cd dist
            if [[ "${{ matrix.os }}" == windows-latest ]]; then
              7z a -tzip "devforge-server-${{ matrix.target }}.zip" "${{ matrix.target }}/"*
            else
              zip -r "devforge-server-${{ matrix.target }}.zip" "${{ matrix.target }}"
            fi
          )
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/devforge-server-${{ matrix.target }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
