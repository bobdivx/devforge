name: Release

# Un seul workflow : auto-bump + tag + images Docker + binaires + page GitHub Releases.
# Si la version Cargo.toml est déjà publiée, GitHub incrémente le patch automatiquement.
# Les pushes faits avec GITHUB_TOKEN ne re-déclenchent pas de workflow (pas de boucle).
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          read_cargo_version() {
            awk '/^\[workspace.package\]/{f=1} f && $1=="version"{gsub(/"/,"",$3); print $3; exit}' Cargo.toml
          }

          bump_patch() {
            local v="$1" major minor patch
            IFS=. read -r major minor patch <<< "$v"
            echo "${major}.${minor}.$((patch + 1))"
          }

          apply_version() {
            local old="$1" new="$2"
            sed -i "s/^version = \"${old}\"/version = \"${new}\"/" Cargo.toml
            sed -i "0,/\"version\": \"${old}\"/s//\"version\": \"${new}\"/" apps/web/package.json
            sed -i "s/^version = \"${old}\"$/version = \"${new}\"/" Cargo.lock
          }

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(read_cargo_version)
            if [[ -z "$VERSION" ]]; then
              echo "Impossible de lire la version"
              exit 1
            fi

            # GitHub gère les versions : release déjà là, ou tag figé alors que
            # HEAD a avancé (job web KO → pas de GitHub Release) → bump patch.
            NEED_BUMP=false
            if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              NEED_BUMP=true
              echo "Release v${VERSION} déjà sur GitHub"
            elif git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
              TAG_SHA="$(git rev-list -n 1 "v${VERSION}")"
              HEAD_SHA="$(git rev-parse HEAD)"
              if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
                NEED_BUMP=true
                echo "Tag v${VERSION} existe sans release GitHub, HEAD a avancé"
              fi
            fi

            if [[ "$NEED_BUMP" == "true" ]]; then
              OLD="$VERSION"
              VERSION=$(bump_patch "$OLD")
              echo "Auto-bump GitHub: ${OLD} → ${VERSION}"
              apply_version "$OLD" "$VERSION"

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add Cargo.toml Cargo.lock apps/web/package.json
              git commit -m "chore: bump version ${OLD} → ${VERSION}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            else
              echo "Version ${VERSION} pas encore publiée — release directe"
            fi
          fi

          TAG="v${VERSION}"
          SHOULD=true
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} déjà publiée — skip"
            SHOULD=false
          fi

          if [[ "$SHOULD" == "true" && "${GITHUB_REF_TYPE}" != "tag" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
              git tag -a "${TAG}" -m "DevForge ${TAG}"
              git push origin "refs/tags/${TAG}" || true
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD}" >> "$GITHUB_OUTPUT"

  docker:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker tags
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          HUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          TAGS="ghcr.io/${OWNER_LC}/devforge:${VERSION},ghcr.io/${OWNER_LC}/devforge:latest"
          TAGS="${TAGS},${HUB_USER}/devforge:${VERSION},${HUB_USER}/devforge:latest"
          if [[ "$VERSION" =~ ^([0-9]+\.[0-9]+)\. ]]; then
            MINOR="${BASH_REMATCH[1]}"
            TAGS="${TAGS},ghcr.io/${OWNER_LC}/devforge:${MINOR},${HUB_USER}/devforge:${MINOR}"
          fi
          echo "TAGS=${TAGS}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}

  binaries:
    needs: [prepare, web]
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: devforge-server
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: devforge-server.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
      - name: Build
        run: cargo build -p devforge-server --release
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/${{ matrix.target }}"
          mkdir -p "$STAGE"
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            cp "target/release/${{ matrix.bin }}" "$STAGE/devforge-server.exe"
          else
            cp "target/release/${{ matrix.bin }}" "$STAGE/devforge-server"
            chmod +x "$STAGE/devforge-server"
          fi
          mkdir -p "$STAGE/web" "$STAGE/templates"
          cp -R web-dist/. "$STAGE/web/"
          cp -R crates/templates/. "$STAGE/templates/"
          cat > "$STAGE/LIREMOI.txt" <<'EOF'
          DevForge — logiciel autonome
          ============================

          1. Dézippe ce dossier où tu veux.
          2. Lance devforge-server (Linux) ou devforge-server.exe (Windows).
          3. Le navigateur s’ouvre sur http://127.0.0.1:8000

          L’interface, les templates et tes données (sous-dossier data/)
          restent à côté du programme. Pas de Docker ni de variables à coller.
          EOF
          (
            cd dist
            if [[ "${{ matrix.os }}" == windows-latest ]]; then
              7z a -tzip "devforge-server-${{ matrix.target }}.zip" "${{ matrix.target }}"
            else
              zip -r "devforge-server-${{ matrix.target }}.zip" "${{ matrix.target }}"
            fi
          )
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: DevForge ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: dist/devforge-server-${{ matrix.target }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Build UI
        env:
          PUBLIC_SERVER_URL: /api/v1
        run: |
          docker run --rm \
            -v "$PWD/apps/web:/web" \
            -w /web \
            -e PUBLIC_SERVER_URL=/api/v1 \
            node:22-bookworm \
            bash -lc 'npm install --include=optional && npm run build'
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
