name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install and build
        working-directory: apps/web
        run: |
          npm install --include=optional
          # npm#4828: optional native bindings sometimes skipped on linux CI
          npm install --no-save --include=optional \
            @astrojs/compiler-binding-linux-x64-gnu@0.4.0 \
            @rolldown/binding-linux-x64-gnu@1.2.8
          npm run build

  no-forbidden-brands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-forbidden-names.mjs
