name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web (même image que le Dockerfile)
        run: |
          docker run --rm \
            -v "$PWD/apps/web:/web" \
            -w /web \
            -e PUBLIC_SERVER_URL=/api/v1 \
            node:22-bookworm \
            bash -lc 'npm install --include=optional && npm run build'

  no-forbidden-brands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-forbidden-names.mjs
