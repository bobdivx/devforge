name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install and build
        working-directory: apps/web
        run: |
          set +e
          npm install --include=optional
          INST=$?
          echo "npm install exit=$INST"
          ls node_modules/.bin || true
          node -e "try{console.log('astro', require.resolve('astro'))}catch(e){console.error('NO ASTRO', e.message)}"
          npm run build
          BUILD=$?
          echo "npm run build exit=$BUILD"
          if [ "$INST" -ne 0 ] || [ "$BUILD" -ne 0 ]; then
            echo "::error::web CI failed install=$INST build=$BUILD"
            exit 1
          fi

  no-forbidden-brands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-forbidden-names.mjs
