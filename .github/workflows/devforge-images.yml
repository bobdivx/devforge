name: DevForge Docker Images

# Build & push to Docker Hub: bobdivx/devforge
# Tags per component: api / web / realtime / helper / agent (+ -latest, -sha-*, -version)
# Hub :agent and GHCR devforge-agent:latest are published from docker/devforge-agent/Dockerfile
# Also mirrors to GHCR: ghcr.io/<owner>/devforge-<component>
#
# Note: :helper is required on every deployment server (pulled on demand by
# ApplicationDeploymentJob). Without it, deploys fail with "manifest unknown".
# Version tags come from prepare (DevForge semver), never a php sidecar.

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - docker/devforge-api/**
      - docker/devforge-web/**
      - docker/devforge-realtime/**
      - docker/devforge-helper/**
      - docker/devforge-agent/**
      - agent/**
      - docker/devforge-proxy/**
      - docker/production/**
      - scripts/**
      - package.json
      - package-lock.json
      - .dockerignore
      - .github/workflows/devforge-images.yml
  workflow_dispatch:

concurrency:
  group: devforge-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

env:
  DOCKERHUB_IMAGE: bobdivx/devforge
  GHCR_REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: [self-hosted, devforge]
    outputs:
      current: ${{ steps.compute.outputs.current }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute next version
        id: compute
        run: |
          # Read current version from constants.php (coolify.version line only)
          CURRENT=$(awk -F"'" '/coolify.*=>.*\[/,/\]/ { if (/'\''version'\''/) { print $4; exit } }' backend/config/constants.php)
          if [ -z "$CURRENT" ]; then
            echo "Error: Could not extract coolify.version from constants.php"
            exit 1
          fi
          echo "Current version: $CURRENT"
          
          # Parse semver and increment patch
          if [[ "$CURRENT" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          else
            echo "Error: Invalid version format: $CURRENT"
            exit 1
          fi
          
          echo "Next version: $NEW_VERSION"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: [self-hosted, devforge]
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: api
            file: docker/devforge-api/Dockerfile
          - name: web
            file: docker/devforge-web/Dockerfile
          - name: realtime
            file: docker/devforge-realtime/Dockerfile
          - name: helper
            file: docker/devforge-helper/Dockerfile
          - name: proxy
            file: docker/devforge-proxy/Dockerfile
          - name: agent
            file: docker/devforge-agent/Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Apply version patch
        run: |
          CURRENT="${{ needs.prepare.outputs.current }}"
          NEW_VERSION="${{ needs.prepare.outputs.version }}"
          echo "Patching version: $CURRENT -> $NEW_VERSION"
          
          # Update backend/config/constants.php (coolify.version only)
          awk -v old="$CURRENT" -v new="$NEW_VERSION" '
            /coolify.*=>.*\[/,/\]/ {
              if (/'\''version'\'' =>/) {
                sub(old, new)
              }
            }
            { print }
          ' backend/config/constants.php > backend/config/constants.php.tmp
          mv backend/config/constants.php.tmp backend/config/constants.php
          
          # Update backend/versions.json (all matching DevForge version fields)
          sed -i "s/\"version\": \"${CURRENT}\"/\"version\": \"${NEW_VERSION}\"/g" backend/versions.json
          
          echo "Patched files for build:"
          git diff backend/config/constants.php backend/versions.json

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${{ needs.prepare.outputs.version }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "unknown" ]; then
            echo "Error: prepare did not produce a version"
            exit 1
          fi
          OWNER_LC='${{ github.repository_owner }}'
          OWNER_LC="${OWNER_LC,,}"
          COMPONENT='${{ matrix.name }}'
          HUB="${{ env.DOCKERHUB_IMAGE }}"
          GHCR="${{ env.GHCR_REGISTRY }}/${OWNER_LC}/devforge-${COMPONENT}"

          {
            echo "sha=${SHORT_SHA}"
            echo "version=${VERSION}"
            echo "hub=${HUB}"
            echo "ghcr=${GHCR}"
            echo "component=${COMPONENT}"
          } >> "$GITHUB_OUTPUT"

          # Primary Hub tags stay component-scoped for web/realtime/helper.
          # For api (the main NAS image), also publish plain :latest / :{version}
          # so compose can use bobdivx/devforge:latest instead of :api.
          {
            echo "tags<<EOF"
            echo "${HUB}:${COMPONENT}"
            echo "${HUB}:${COMPONENT}-latest"
            echo "${HUB}:${COMPONENT}-sha-${SHORT_SHA}"
            echo "${HUB}:${COMPONENT}-${VERSION}"
            if [ "${COMPONENT}" = "api" ]; then
              echo "${HUB}:latest"
              echo "${HUB}:${VERSION}"
              echo "${HUB}:sha-${SHORT_SHA}"
            fi
            echo "${GHCR}:latest"
            echo "${GHCR}:sha-${SHORT_SHA}"
            echo "${GHCR}:${VERSION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Docker Hub tags:"
          if [ "${COMPONENT}" = "api" ]; then
            echo "  ${HUB}:latest   ← tag principal (compose NAS)"
            echo "  ${HUB}:${VERSION}"
            echo "  ${HUB}:sha-${SHORT_SHA}"
          fi
          echo "  ${HUB}:${COMPONENT}"
          echo "  ${HUB}:${COMPONENT}-latest"
          echo "  ${HUB}:${COMPONENT}-sha-${SHORT_SHA}"
          echo "  ${HUB}:${COMPONENT}-${VERSION}"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=devforge-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=devforge-${{ matrix.name }}

  summary:
    runs-on: [self-hosted, devforge]
    needs: build
    if: always()
    continue-on-error: true
    steps:
      - name: Print image refs
        run: |
          echo "Docker Hub (https://hub.docker.com/r/bobdivx/devforge):"
          echo "  bobdivx/devforge:latest          ← API (principal)"
          echo "  bobdivx/devforge:<version>       ← API versionnée"
          echo "  bobdivx/devforge:api             ← alias rétrocompat"
          echo "  bobdivx/devforge:web"
          echo "  bobdivx/devforge:realtime"
          echo "  bobdivx/devforge:helper"
          echo "  bobdivx/devforge:proxy"
          echo "  bobdivx/devforge:agent"
          echo "GHCR mirrors:"
          echo "  ghcr.io/bobdivx/devforge-api:latest"
          echo "  ghcr.io/bobdivx/devforge-web:latest"
          echo "  ghcr.io/bobdivx/devforge-realtime:latest"
          echo "  ghcr.io/bobdivx/devforge-helper:latest"
          echo "  ghcr.io/bobdivx/devforge-proxy:latest"
          echo "  ghcr.io/bobdivx/devforge-agent:latest"

  commit-version:
    runs-on: [self-hosted, devforge]
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply version patch and commit
        run: |
          CURRENT="${{ needs.prepare.outputs.current }}"
          NEW_VERSION="${{ needs.prepare.outputs.version }}"
          
          # Check if files already have the new version (idempotent)
          EXISTING=$(awk -F"'" '/coolify.*=>.*\[/,/\]/ { if (/'\''version'\''/) { print $4; exit } }' backend/config/constants.php)
          if [ "$EXISTING" = "$NEW_VERSION" ]; then
            echo "Version already at $NEW_VERSION, skipping commit"
            exit 0
          fi
          
          echo "Updating GitHub main: $CURRENT -> $NEW_VERSION"
          
          # Update backend/config/constants.php (coolify.version only)
          awk -v old="$CURRENT" -v new="$NEW_VERSION" '
            /coolify.*=>.*\[/,/\]/ {
              if (/'\''version'\'' =>/) {
                sub(old, new)
              }
            }
            { print }
          ' backend/config/constants.php > backend/config/constants.php.tmp
          mv backend/config/constants.php.tmp backend/config/constants.php
          
          # Update backend/versions.json (all matching DevForge version fields)
          sed -i "s/\"version\": \"${CURRENT}\"/\"version\": \"${NEW_VERSION}\"/g" backend/versions.json
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/config/constants.php backend/versions.json
          
          # Commit only if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bump version to ${NEW_VERSION} [skip version bump]"
            git push origin HEAD:${{ github.ref_name }}
            echo "✓ Version committed and pushed to GitHub"
          fi
