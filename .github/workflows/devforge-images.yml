name: DevForge Docker Images

# Build & push to Docker Hub: bobdivx/devforge
# Tags per component: api / web / realtime / helper (+ -latest, -sha-*, -version)
# Also mirrors to GHCR: ghcr.io/<owner>/devforge-<component>
#
# Note: :helper is required on every deployment server (pulled on demand by
# ApplicationDeploymentJob). Without it, deploys fail with "manifest unknown".

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - docker/devforge-api/**
      - docker/devforge-web/**
      - docker/devforge-realtime/**
      - docker/devforge-helper/**
      - docker/production/**
      - package.json
      - package-lock.json
      - .github/workflows/devforge-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: bobdivx/devforge
  GHCR_REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: docker/devforge-api/Dockerfile
          - name: web
            file: docker/devforge-web/Dockerfile
          - name: realtime
            file: docker/devforge-realtime/Dockerfile
          - name: helper
            file: docker/devforge-helper/Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="unknown"
          if [ -f backend/bootstrap/getVersion.php ]; then
            RAW_VERSION="$(docker run --rm -v "$(pwd):/app" -w /app/backend php:8.4-cli-alpine \
              php -d display_errors=0 -d display_startup_errors=0 bootstrap/getVersion.php 2>/dev/null || true)"
            RAW_VERSION="$(printf '%s' "$RAW_VERSION" | tr -d '\r' | tail -n 1 | tr -d '[:space:]')"
            if [ -n "$RAW_VERSION" ]; then
              VERSION="${RAW_VERSION//\//-}"
            fi
          fi
          OWNER_LC='${{ github.repository_owner }}'
          OWNER_LC="${OWNER_LC,,}"
          COMPONENT='${{ matrix.name }}'
          HUB="${{ env.DOCKERHUB_IMAGE }}"
          GHCR="${{ env.GHCR_REGISTRY }}/${OWNER_LC}/devforge-${COMPONENT}"

          {
            echo "sha=${SHORT_SHA}"
            echo "version=${VERSION}"
            echo "hub=${HUB}"
            echo "ghcr=${GHCR}"
            echo "component=${COMPONENT}"
          } >> "$GITHUB_OUTPUT"

          echo "Docker Hub tags:"
          echo "  ${HUB}:${COMPONENT}"
          echo "  ${HUB}:${COMPONENT}-latest"
          echo "  ${HUB}:${COMPONENT}-sha-${SHORT_SHA}"
          echo "  ${HUB}:${COMPONENT}-${VERSION}"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.hub }}:${{ steps.meta.outputs.component }}
            ${{ steps.meta.outputs.hub }}:${{ steps.meta.outputs.component }}-latest
            ${{ steps.meta.outputs.hub }}:${{ steps.meta.outputs.component }}-sha-${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.hub }}:${{ steps.meta.outputs.component }}-${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ghcr }}:latest
            ${{ steps.meta.outputs.ghcr }}:sha-${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=devforge-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=devforge-${{ matrix.name }}

  summary:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Print image refs
        run: |
          echo "Docker Hub (https://hub.docker.com/r/bobdivx/devforge):"
          echo "  bobdivx/devforge:api"
          echo "  bobdivx/devforge:api-latest"
          echo "  bobdivx/devforge:web"
          echo "  bobdivx/devforge:web-latest"
          echo "  bobdivx/devforge:realtime"
          echo "  bobdivx/devforge:realtime-latest"
          echo "  bobdivx/devforge:helper"
          echo "  bobdivx/devforge:helper-latest"
          echo "GHCR mirrors:"
          echo "  ghcr.io/bobdivx/devforge-api:latest"
          echo "  ghcr.io/bobdivx/devforge-web:latest"
          echo "  ghcr.io/bobdivx/devforge-realtime:latest"
          echo "  ghcr.io/bobdivx/devforge-helper:latest"
