name: Tag version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT_TOKEN || secrets.DEVFORGE_STORE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create or recreate tag from workspace version
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.DEVFORGE_STORE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(awk '/^\[workspace.package\]/{f=1} f && $1=="version"{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          if [[ -z "$VERSION" ]]; then
            echo "Impossible de lire la version dans Cargo.toml"
            exit 1
          fi
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          HAS_TAG=0
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            HAS_TAG=1
          fi
          HAS_RELEASE=0
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            HAS_RELEASE=1
          fi

          if [[ "$HAS_TAG" -eq 1 && "$HAS_RELEASE" -eq 1 ]]; then
            echo "Tag et release ${TAG} déjà présents"
            exit 0
          fi

          if [[ "$HAS_TAG" -eq 1 && "$HAS_RELEASE" -eq 0 ]]; then
            echo "Tag ${TAG} sans release GitHub — recreation pour déclencher Release"
            git tag -d "${TAG}" || true
            git push origin ":refs/tags/${TAG}" || true
          fi

          git tag -a "${TAG}" -m "DevForge ${TAG}"
          git push origin "${TAG}"
