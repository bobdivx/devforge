# Installeurs : une fois par jour, et seulement s'il y a eu des commits.
# Windows : assistant Inno Setup (.exe). Linux : bundle Flatpak.
# Un lancement manuel (workflow_dispatch) construit même sans commit récent.
name: Installeurs Linux et Windows

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de release cible (vide = dernière release)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: os-images
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # v2.0.108 est tagué avant les fichiers d'installeur : on compile
          # alors le commit du workflow, et on attache quand même les fichiers
          # à cette release.
          REF="$TAG"
          if ! git cat-file -e "${TAG}:deploy/windows/devforge.iss" 2>/dev/null; then
            echo "Tag ${TAG} sans assistant — compilation depuis ${GITHUB_SHA}"
            REF="${GITHUB_SHA}"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Lancement manuel"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          n="$(git rev-list --count --since='24 hours ago' HEAD)"
          if [[ "$n" -eq 0 ]]; then
            echo "Aucun commit dans les dernières 24 h — images non construites"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "${n} commit(s) dans les dernières 24 h"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  web:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.ref }}
      - name: Build UI
        env:
          PUBLIC_SERVER_URL: /api/v1
        run: |
          docker run --rm \
            -v "$PWD/apps/web:/web" \
            -w /web \
            -e PUBLIC_SERVER_URL=/api/v1 \
            node:22-bookworm \
            bash -lc 'npm install --include=optional && npm run build'
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  windows:
    needs: [gate, web]
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
      - name: Build
        run: cargo build -p devforge-server --release
      - name: Préparer les fichiers
        shell: pwsh
        run: |
          $stage = Join-Path $pwd "dist\windows-stage"
          New-Item -ItemType Directory -Force -Path "$stage\web","$stage\templates" | Out-Null
          Copy-Item "target\release\devforge-server.exe" "$stage\devforge-server.exe"
          Copy-Item "apps\web\public\favicon.ico" "$stage\devforge.ico"
          Copy-Item "web-dist\*" "$stage\web" -Recurse -Force
          Copy-Item "crates\templates\*" "$stage\templates" -Recurse -Force
      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compiler l’assistant
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC introuvable" }
          $stage = Join-Path $pwd "dist\windows-stage"
          $out = Join-Path $pwd "dist"
          & $iscc "/DAppVersion=${{ needs.gate.outputs.version }}" "/DStage=$stage" "/DOutputDir=$out" "deploy\windows\devforge.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          files: dist/DevForge-Setup-${{ needs.gate.outputs.version }}-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    needs: [gate, web]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: DevForge-${{ needs.gate.outputs.version }}-x86_64.flatpak
          manifest-path: deploy/flatpak/io.github.bobdivx.DevForge.yml
          cache-key: flatpak-${{ needs.gate.outputs.tag }}
          upload-artifact: false
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          files: DevForge-${{ needs.gate.outputs.version }}-x86_64.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  retire-zips:
    needs: [gate, windows, linux]
    if: needs.windows.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Retirer les anciens zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.gate.outputs.tag }}"
          for name in \
            devforge-server-x86_64-unknown-linux-gnu.zip \
            devforge-server-x86_64-pc-windows-msvc.zip
          do
            gh release delete-asset "$tag" "$name" --repo "$GITHUB_REPOSITORY" --yes || true
          done
