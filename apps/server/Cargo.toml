[package]
name = "devforge-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "devforge-server"
path = "src/main.rs"

[dependencies]
devforge-shared = { workspace = true }
devforge-agent = { workspace = true }
devforge-deploy = { workspace = true }
devforge-github = { workspace = true }
devforge-database = { workspace = true }
devforge-mcp = { workspace = true }
devforge-env = { workspace = true }
devforge-ports = { workspace = true }
devforge-domain = { workspace = true }
devforge-proxy = { workspace = true }
devforge-wireguard = { workspace = true }
devforge-storage = { workspace = true }
devforge-backup = { workspace = true }
devforge-auth = { workspace = true }
devforge-detect = { workspace = true }
devforge-llm = { workspace = true }
devforge-update = { workspace = true }
devforge-runner = { workspace = true }
devforge-cron = { workspace = true }
devforge-cluster = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = { workspace = true }
dotenvy = "0.15"
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
reqwest = { workspace = true }
urlencoding = "2.1"
once_cell = "1.20"
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
